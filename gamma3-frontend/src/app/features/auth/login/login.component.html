<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-circle">
        <i class="pi pi-shield"></i>
      </div>
      <h2>GAMMA 3</h2>
      <p class="subtitle">Marine Nationale Tunisienne</p>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="login-form">
      <div class="p-fluid">
        <div class="field mb-4">
          <label for="matricule" class="block text-900 font-medium mb-2">Matricule</label>
          <span class="p-input-icon-left w-full">
            <i class="pi pi-user"></i>
            <input
              id="matricule"
              type="text"
              pInputText
              [(ngModel)]="matricule"
              name="matricule"
              placeholder="Saisissez votre matricule"
              required
              class="w-full"
            />
          </span>
        </div>

        <div class="field mb-4">
          <label for="password" class="block text-900 font-medium mb-2">Mot de passe</label>
          <span class="p-input-icon-left w-full">
            <i class="pi pi-lock"></i>
            <input
              id="password"
              type="password"
              pInputText
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              required
              class="w-full"
            />
          </span>
        </div>

        <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="mb-4 w-full"></p-message>

        <button
          pButton
          pRipple
          label="Connexion"
          icon="pi pi-sign-in"
          class="w-full mt-2 login-btn"
          [loading]="isLoading"
          type="submit"
          [disabled]="!loginForm.form.valid"
        ></button>
      </div>
    </form>
    
    <div class="login-footer">
      <p>Accès restreint. Tout accès non autorisé est passible de sanctions militaires.</p>
    </div>
  </div>
</div>
