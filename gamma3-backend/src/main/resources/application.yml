spring:
  application:
    name: gamma3-backend
  
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gamma3_db}
    username: ${DB_USERNAME:gamma3_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000 # a day

