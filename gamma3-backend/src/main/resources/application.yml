spring:
  application:
    name: gamma3-backend
  
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  
  datasource:
    url: jdbc:postgresql://localhost:5433/gamma3_db
    username: gamma3_user
    password: gamma3_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # a day
    default-admin:
      matricule: ${ADMIN_MATRICULE:admin}
      password: ${ADMIN_PASSWORD:admin}
